<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Botanic — Poster A3</title>
		<meta
			name="description"
			content="El wallapop de las plantas. Vende, cambia o regala plantas en la primera comunidad donde las plantas conocen a gente nueva."
		/>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Onest:wght@300..700&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="/poster/poster.css" />
	</head>

<body>
		<main class="poster" role="main">
			<header class="poster-header">
				<div class="logo" aria-label="Botanic">
					<span class="logo-bo">Bo</span>
					<svg
						class="logo-icon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M7 20h10" />
						<path d="M10 20c5.5-2.5.8-6.4 3-10" />
						<path
							d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"
						/>
						<path
							d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"
						/>
					</svg>
					<span class="logo-anic">anic</span>
				</div>
			</header>

			<section class="copy" aria-labelledby="headline">
				<h1 id="headline" class="headline">El <em>wallapop</em> de las plantas</h1>
				<p class="sub">
					Vende, cambia o regala tus plantas.<br />Si te gustan, esto te va a
					encantar.<br />Hecho por y para <em>plant lovers</em>.
				</p>
			</section>

			<section class="cta" aria-label="Únete a la waitlist">
				<img
					class="qr"
					src="/poster/qr.svg"
					alt="Código QR que abre la waitlist de Botanic"
				/>
				<div class="cta-text">
					<p class="cta-line">
						Apuntate a la lista de espera para ser de los primeros en usar nuestra
						app.
					</p>
					<p class="cta-line">
						Escanea el QR o visitanos es www.botanicapp.es
					</p>
				</div>
			</section>
		</main>
	</body>
</html>
